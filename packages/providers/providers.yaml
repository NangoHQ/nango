salescaptain:
    display_name: SalesCaptain
    categories:
        - crm
        - communication
        - support

    auth_mode: API_KEY

    proxy:
        base_url: https://api.salescaptain.com
        headers:
            authorization: Bearer ${apiKey}
            accept: application/json
            content-type: application/json

        verification:
            method: GET
            headers:
                content-type: application/json
            endpoints:
                - /v1/fetch-companies

        retry:
            after:
                - 'retry-after'

    docs: https://nango.dev/docs/api-integrations/salescaptain
    docs_connect: https://nango.dev/docs/api-integrations/salescaptain

    credentials:
        apiKey:
            type: string
            title: API Key
            description: API key for SalesCaptain API authentication.
            secret: true