<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Auth urls carry tokens in the path. Cloud serves this from a CDN, so the server's
             Referrer-Policy header doesn't apply. Must stay above any request-initiating tag. -->
        <meta name="referrer" content="strict-origin" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
            media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
            media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)"
        />
        <link rel="shortcut icon" href="/favicon.ico" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-dark-16x16.png" media="(prefers-color-scheme: dark)" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
        <link rel="shortcut icon" href="/favicon-dark.ico" media="(prefers-color-scheme: dark)" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Get OAuth tokens for APIs. Fast & secure." />
        <link rel="manifest" href="/manifest.json" />
        <title>Nango</title>

        <!-- Apply saved theme before first paint to avoid flash -->
        <script>
            (function () {
                var dark;
                try {
                    var s = localStorage.getItem('nango_theme');
                    var parsed = s ? JSON.parse(s) : null;
                    var state = parsed && parsed.state;
                    // Support new `theme` field and old boolean `darkMode`; default to dark to match the app default
                    var theme = state && state.theme ? state.theme : state && state.darkMode === false ? 'light' : 'dark';
                    dark = theme === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark';
                } catch (e) {
                    dark = true;
                }
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            })();
        </script>

        <meta name="nango-api-origin" content="" />
        <meta name="nango-env-hash" content="%VITE_HASH%" />
    </head>

    <body class="bg-white dark:bg-surface-canvas">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
