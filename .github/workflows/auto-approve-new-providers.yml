name: Auto-Approve New Provider PRs
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        paths:
            - 'packages/providers/providers.yaml'
permissions:
    contents: read
    pull-requests: read
jobs:
    auto-approve:
        runs-on: ubuntu-latest
        steps:
            - name: Check if trusted author
              id: trust_check
              uses: actions/github-script@v7
              with:
                  script: |
                      const login = context.payload.pull_request.user.login;
                      const org = context.repo.owner;

                      // Collaborators (write and admin)
                      try {
                        const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          username: login,
                        });
                        if (['write', 'admin'].includes(data.permission)) {
                          console.log(`Trusted: collaborator ${login} (${data.permission})`);
                          return true;
                        }
                      } catch (err) { if (err.status !== 404) throw err; }

                      // Engineers team
                      try {
                        const { data: teamMembership } = await github.rest.teams.getMembershipForUserInOrg({
                          org,
                          team_slug: 'engineers',
                          username: login,
                        });
                        if (teamMembership.state === 'active') {
                          console.log(`Trusted: engineers team member ${login}`);
                          return true;
                        }
                      } catch (err) { if (err.status !== 404) throw err; }

                      console.log(`Not trusted: ${login}`);
                      return false;
                  result-encoding: string

            - name: Checkout base branch
              if: steps.trust_check.outputs.result == 'true'
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Fetch PR head (as data only)
              if: steps.trust_check.outputs.result == 'true'
              run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"

            - uses: ./.github/actions/setup-node
              if: steps.trust_check.outputs.result == 'true'

            - name: Install dependencies
              if: steps.trust_check.outputs.result == 'true'
              run: npm ci --ignore-scripts

            - name: Check the PR only adds new providers
              if: steps.trust_check.outputs.result == 'true'
              id: providers_check
              run: node scripts/auto-approve-new-providers.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

            - name: Generate GitHub App token
              if: ${{ !cancelled() && steps.trust_check.outputs.result == 'true' }}
              id: app-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.GH_APP_PUSHER_ID }}
                  private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}

            - name: Approve PR
              if: steps.providers_check.outputs.approve == 'true'
              uses: hmarr/auto-approve-action@v4
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  review-message: |
                      ✅ Auto-approved: only adds new providers (${{ steps.providers_check.outputs.added }}).

            - name: Dismiss earlier auto-approval
              if: ${{ !cancelled() && steps.trust_check.outputs.result == 'true' && steps.providers_check.outputs.approve != 'true' }}
              uses: actions/github-script@v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const botLogin = 'nango-repository-pusher[bot]';
                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request.number,
                      });
                      for (const review of reviews) {
                        if (review.state === 'APPROVED' && review.user?.login === botLogin) {
                          await github.rest.pulls.dismissReview({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            pull_number: context.payload.pull_request.number,
                            review_id: review.id,
                            message: 'The PR no longer only adds new providers, so the auto-approval was withdrawn.',
                          });
                          console.log(`Dismissed review ${review.id} by ${review.user.login}`);
                        }
                      }
