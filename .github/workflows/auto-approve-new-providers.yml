name: Auto-Approve New Provider PRs
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        paths:
            - 'packages/providers/providers.yaml'
    workflow_run:
        workflows: [Auto-Approve Review Trigger]
        types: [completed]
permissions:
    contents: read
    pull-requests: read
concurrency:
    group: auto-approve-new-providers-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    cancel-in-progress: true
jobs:
    auto-approve:
        if: github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Find the PR
              id: pr
              uses: actions/github-script@v7
              with:
                  script: |
                      let pr = context.payload.pull_request;

                      // Rerun after a review: look up the PR, which workflow_run only lists for branches in this repo
                      if (context.eventName === 'workflow_run') {
                        const number = context.payload.workflow_run.pull_requests[0]?.number;
                        if (!number) {
                          console.log(`No PR for branch ${context.payload.workflow_run.head_branch}`);
                          return false;
                        }
                        const params = {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: number,
                        };
                        ({ data: pr } = await github.rest.pulls.get(params));

                        // The paths filter doesn't apply to workflow_run
                        const files = await github.paginate(github.rest.pulls.listFiles, params);
                        if (!files.some((f) => f.filename === 'packages/providers/providers.yaml')) {
                          console.log(`Skipped: PR #${number} doesn't change providers.yaml`);
                          return false;
                        }
                      }

                      core.setOutput('number', pr.number);
                      core.setOutput('author', pr.user.login);
                      core.setOutput('base_sha', pr.base.sha);
                      core.setOutput('head_sha', pr.head.sha);
                      return true;
                  result-encoding: string

            - name: Check if trusted author
              if: steps.pr.outputs.result == 'true'
              id: trust_check
              uses: actions/github-script@v7
              env:
                  AUTHOR: ${{ steps.pr.outputs.author }}
              with:
                  script: |
                      const login = process.env.AUTHOR;

                      // Effective repo permission, which includes access granted through org teams
                      try {
                        const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          username: login,
                        });
                        if (['write', 'admin'].includes(data.permission)) {
                          console.log(`Trusted: collaborator ${login} (${data.permission})`);
                          return true;
                        }
                      } catch (err) { if (err.status !== 404) throw err; }

                      console.log(`Not trusted: ${login}`);
                      return false;
                  result-encoding: string

            - name: Checkout base branch
              if: steps.trust_check.outputs.result == 'true'
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.pr.outputs.base_sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Fetch PR head (as data only)
              if: steps.trust_check.outputs.result == 'true'
              run: git fetch --no-tags origin "pull/${{ steps.pr.outputs.number }}/head"

            - uses: ./.github/actions/setup-node
              if: steps.trust_check.outputs.result == 'true'

            - name: Install dependencies
              if: steps.trust_check.outputs.result == 'true'
              run: npm ci --ignore-scripts

            - name: Check the PR only adds new providers
              if: steps.trust_check.outputs.result == 'true'
              id: providers_check
              run: node scripts/auto-approve-new-providers.mjs "${{ steps.pr.outputs.base_sha }}" "${{ steps.pr.outputs.head_sha }}"

            - name: Generate GitHub App token
              if: ${{ !cancelled() && steps.trust_check.outputs.result == 'true' }}
              id: app-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.GH_APP_PUSHER_ID }}
                  private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}

            - name: Check the PR head is unchanged
              if: steps.providers_check.outputs.approve == 'true'
              id: head_check
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data: pr } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: ${{ steps.pr.outputs.number }},
                      });
                      const checked = '${{ steps.pr.outputs.head_sha }}';
                      if (pr.head.sha !== checked) {
                        console.log(`PR head moved from ${checked} to ${pr.head.sha}; skipping approval`);
                        return false;
                      }
                      return true;
                  result-encoding: string

            - name: Check Cubic has reviewed
              if: steps.head_check.outputs.result == 'true'
              id: cubic_check
              uses: actions/github-script@v7
              with:
                  script: |
                      const { repository } = await github.graphql(
                        `query($owner: String!, $repo: String!, $number: Int!) {
                          repository(owner: $owner, name: $repo) {
                            pullRequest(number: $number) {
                              reviews(first: 100) { nodes { author { login } } }
                              reviewThreads(first: 100) { nodes { isResolved comments(first: 1) { nodes { author { login } } } } }
                            }
                          }
                        }`,
                        { owner: context.repo.owner, repo: context.repo.repo, number: ${{ steps.pr.outputs.number }} }
                      );
                      const { reviews, reviewThreads } = repository.pullRequest;
                      const isCubic = (node) => node?.author?.login === 'cubic-dev-ai';

                      if (!reviews.nodes.some(isCubic)) {
                        console.log('Waiting: Cubic has not reviewed yet');
                        return false;
                      }
                      const unresolved = reviewThreads.nodes.filter((t) => !t.isResolved && isCubic(t.comments.nodes[0])).length;
                      if (unresolved > 0) {
                        console.log(`Waiting: ${unresolved} unresolved Cubic thread(s)`);
                        return false;
                      }

                      console.log('Cubic has reviewed and all its threads are resolved');
                      return true;
                  result-encoding: string

            - name: Approve PR
              if: steps.providers_check.outputs.approve == 'true' && steps.head_check.outputs.result == 'true' && steps.cubic_check.outputs.result == 'true'
              uses: hmarr/auto-approve-action@v4
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  pull-request-number: ${{ steps.pr.outputs.number }}
                  review-message: |
                      ✅ Auto-approved: only adds new providers (${{ steps.providers_check.outputs.added }}).

            - name: Dismiss earlier auto-approval
              if: ${{ !cancelled() && steps.trust_check.outputs.result == 'true' && steps.providers_check.outputs.approve != 'true' }}
              uses: actions/github-script@v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const botLogin = 'nango-repository-pusher[bot]';
                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: ${{ steps.pr.outputs.number }},
                      });
                      for (const review of reviews) {
                        if (review.state === 'APPROVED' && review.user?.login === botLogin) {
                          await github.rest.pulls.dismissReview({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            pull_number: ${{ steps.pr.outputs.number }},
                            review_id: review.id,
                            message: 'The PR no longer only adds new providers, so the auto-approval was withdrawn.',
                          });
                          console.log(`Dismissed review ${review.id} by ${review.user.login}`);
                        }
                      }
