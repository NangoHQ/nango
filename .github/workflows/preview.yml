name: Preview Deploys

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - 'packages/webapp/**'
            - 'packages/design-system/**'

permissions: {}

concurrency:
    group: preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

# The slug doubles as the preview host label: the CloudFront viewer-request function
# maps `<slug>.app-development.nango.dev` back to the `previews/<slug>/` S3 prefix.
env:
    WEBAPP_SLUG: pr-${{ github.event.pull_request.number }}
    WEBAPP_URL: https://pr-${{ github.event.pull_request.number }}.app-development.nango.dev
    STORYBOOK_SLUG: pr-${{ github.event.pull_request.number }}-storybook
    STORYBOOK_URL: https://pr-${{ github.event.pull_request.number }}-storybook.app-development.nango.dev

jobs:
    # All previews report into one sticky comment. `comment-init` and `comment-final` are
    # its only writers, so concurrent deploys can never clobber each other's status.
    comment-init:
        name: Post preview comment
        runs-on: ubuntu-latest
        # Security note: forked PRs using `pull_request` do not receive secrets or OIDC
        # tokens, so untrusted fork code cannot assume the deploy role. The OIDC role is
        # also scoped solely to the dev preview S3 bucket — a compromise cannot reach
        # production resources. Fork PRs are skipped entirely to avoid wasted CI builds.
        # The deploy jobs inherit this guard by depending on this job.
        if: github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read # checkout the repo to reach the local composite action
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false

            - uses: ./.github/actions/preview-comment
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  rows: >-
                      [
                        { "name": "Webapp", "url": "${{ env.WEBAPP_URL }}", "status": "deploying" },
                        { "name": "Storybook", "url": "${{ env.STORYBOOK_URL }}", "status": "deploying" }
                      ]

    webapp:
        name: Webapp
        needs: [comment-init]
        runs-on: ubuntu-latest
        environment: development
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build Webapp
              run: npm run ts-build && npm run -w @nangohq/webapp build

            - name: Inject API origin into dist/index.html
              run: |
                  sed -E -i 's#(<meta name="nango-api-origin" content=")[^"]*(")#\1${{ vars.API_DOMAIN }}\2#' packages/webapp/dist/index.html

            - uses: ./.github/actions/deploy-preview
              with:
                  role: ${{ vars.PREVIEW_APP_UI_ROLE }}
                  region: ${{ vars.AWS_REGION }}
                  bucket: ${{ vars.PREVIEW_APP_UI_BUCKET }}
                  distribution_id: ${{ vars.PREVIEW_APP_UI_DISTRIBUTION_ID }}
                  slug: ${{ env.WEBAPP_SLUG }}
                  dist_path: packages/webapp/dist/

    storybook:
        name: Storybook
        needs: [comment-init]
        runs-on: ubuntu-latest
        environment: development
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build Storybook
              run: npm run ts-build && npm run -w @nangohq/design-system build-storybook

            - uses: ./.github/actions/deploy-preview
              with:
                  role: ${{ vars.PREVIEW_APP_UI_ROLE }}
                  region: ${{ vars.AWS_REGION }}
                  bucket: ${{ vars.PREVIEW_APP_UI_BUCKET }}
                  distribution_id: ${{ vars.PREVIEW_APP_UI_DISTRIBUTION_ID }}
                  slug: ${{ env.STORYBOOK_SLUG }}
                  dist_path: packages/design-system/storybook-static/

    comment-final:
        name: Update preview comment
        needs: [comment-init, webapp, storybook]
        # Reports on failure and on cancellation too, so a cancelled run doesn't strand the
        # comment on "Deploying". A superseded run can't clobber a newer one's status: the
        # action skips the write when the comment already carries a higher run id.
        # The `needs` check re-states the fork guard that `always()` would otherwise defeat.
        if: always() && needs.comment-init.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout the repo to reach the local composite action
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false

            - uses: ./.github/actions/preview-comment
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  rows: >-
                      [
                        { "name": "Webapp", "url": "${{ env.WEBAPP_URL }}", "status": "${{ needs.webapp.result }}" },
                        { "name": "Storybook", "url": "${{ env.STORYBOOK_URL }}", "status": "${{ needs.storybook.result }}" }
                      ]
