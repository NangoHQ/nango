name: Auto-Approve Review Trigger
on:
    pull_request_review:
        types: [submitted]
permissions: {}
jobs:
    trigger:
        if: github.event.review.user.login == 'cubic-dev-ai[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Trigger auto-approval check
              run: echo "Review activity on PR ${{ github.event.pull_request.number }}"
