name: '[Release] Build unified Docker image'

on:
    push:
        branches:
            - master
            - staging/**
    pull_request:
    merge_group:

# paths-filter lists a PR's files through the API
permissions:
    contents: read
    pull-requests: read

jobs:
    should-run:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.check.outputs.should_skip }}
            can_push: ${{ steps.check.outputs.can_push }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  predicate-quantifier: 'every'
                  filters: |
                      docs_only:
                          - 'docs/**'
                      non_docs:
                          - '**'
                          - '!docs/**'
            - name: Determine if should skip
              id: check
              run: |
                  # Run on PRs only if not docs only
                  # Always run on merge queue
                  # Always run on direct pushes to master (not merge queue bot)
                  IS_PR="${{ github.event_name == 'pull_request' }}"
                  IS_MERGE_QUEUE="${{ github.event_name == 'merge_group' }}"
                  IS_DIRECT_PUSH_TO_MASTER="${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-merge-queue[bot]' }}"
                  IS_DOCS_ONLY="${{ steps.filter.outputs.docs_only == 'true' && steps.filter.outputs.non_docs != 'true' }}"

                  SHOULD_SKIP="true"
                  # Always run on merge queue and direct push to master
                  if [[ "$IS_MERGE_QUEUE" == "true" || "$IS_DIRECT_PUSH_TO_MASTER" == "true" ]]; then
                      SHOULD_SKIP="false"
                  # Run on PR only if not docs only
                  elif [[ "$IS_PR" == "true" && "$IS_DOCS_ONLY" != "true" ]]; then
                      SHOULD_SKIP="false"
                  fi

                  echo "should_skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT
                  # An output because `secrets` can't be read in a job-level `if`
                  echo "can_push=${{ secrets.DOCKER_PASSWORD != '' && secrets.DOCKER_USERNAME != '' }}" >> $GITHUB_OUTPUT
    # Each platform builds on a runner of its own architecture so neither is
    # emulated, and is pushed untagged. build-image tags both digests together
    # as nangohq/nango:$SHA, so only that one tag is published.
    build-amd64:
        needs: should-run
        if: needs.should-run.outputs.should_skip != 'true'
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Build
              id: build
              uses: ./.github/actions/build-image-platform
              with:
                  platform: linux/amd64
                  sha: ${{ github.event.pull_request.head.sha || github.sha }}
                  can-push: ${{ needs.should-run.outputs.can_push }}
                  docker-username: '${{ secrets.DOCKER_USERNAME }}'
                  docker-password: '${{ secrets.DOCKER_PASSWORD }}'

    build-arm64:
        needs: should-run
        if: needs.should-run.outputs.should_skip != 'true'
        runs-on: ubuntu-24.04-arm
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Build
              id: build
              uses: ./.github/actions/build-image-platform
              with:
                  platform: linux/arm64
                  sha: ${{ github.event.pull_request.head.sha || github.sha }}
                  can-push: ${{ needs.should-run.outputs.can_push }}
                  docker-username: '${{ secrets.DOCKER_USERNAME }}'
                  docker-password: '${{ secrets.DOCKER_PASSWORD }}'

    # Keeps the `build-image` check name that branch protection requires, and always
    # reports (skipped legs included) so docs-only PRs aren't left waiting on it.
    build-image:
        needs: [should-run, build-amd64, build-arm64]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        env:
            CAN_PUSH: ${{ needs.should-run.outputs.can_push }}
            SHOULD_SKIP: ${{ needs.should-run.outputs.should_skip }}
            SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
            ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}

        steps:
            - name: Check builds
              run: |
                  if [[ "${{ needs.should-run.result }}" != 'success' ]]; then
                    echo "should-run did not succeed"
                    exit 1
                  fi
                  if [[ "$SHOULD_SKIP" != 'true' && "${{ needs.build-amd64.result }}" != 'success' ]]; then
                    echo "build-amd64 did not succeed"
                    exit 1
                  fi
                  if [[ "$SHOULD_SKIP" != 'true' && "${{ needs.build-arm64.result }}" != 'success' ]]; then
                    echo "build-arm64 did not succeed"
                    exit 1
                  fi

            - name: Check out
              if: env.SHOULD_SKIP != 'true' && env.CAN_PUSH == 'true'
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              if: env.SHOULD_SKIP != 'true' && env.CAN_PUSH == 'true'
              with:
                  username: '${{ secrets.DOCKER_USERNAME }}'
                  password: '${{ secrets.DOCKER_PASSWORD }}'

            - name: Push multi-platform tag
              id: merge
              if: env.SHOULD_SKIP != 'true' && env.CAN_PUSH == 'true'
              run: |
                  docker buildx imagetools create -t "nangohq/nango:$SHA" \
                    "nangohq/nango@$AMD64_DIGEST" \
                    "nangohq/nango@$ARM64_DIGEST"

            # Emulates the non-native platform, which is cheap here: the image is a
            # few `rm -rf`s on top of nangohq/nango.
            - name: (self-hosted) Set up QEMU
              if: steps.merge.outcome == 'success' && github.event_name != 'pull_request'
              uses: docker/setup-qemu-action@v3

            - name: (self-hosted) Set up Docker Buildx
              if: steps.merge.outcome == 'success' && github.event_name != 'pull_request'
              uses: docker/setup-buildx-action@v3

            - name: (self-hosted) Expose GitHub Runtime
              if: steps.merge.outcome == 'success' && github.event_name != 'pull_request'
              uses: crazy-max/ghaction-github-runtime@v2

            - name: (self-hosted) Build and push
              if: steps.merge.outcome == 'success' && github.event_name != 'pull_request'
              run: |
                  ./scripts/build_docker_self_hosted.sh "$SHA" true linux/amd64,linux/arm64
