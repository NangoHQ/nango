name: Clean up CI package versions

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

jobs:
    list-packages:
        runs-on: ubuntu-latest
        permissions:
            packages: read
        outputs:
            packages: ${{ steps.list.outputs.packages }}
        steps:
            - id: list
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "packages=$(gh api --paginate '/orgs/NangoHQ/packages?package_type=npm&per_page=100' --jq '.[].name' | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

    delete-old-versions:
        needs: list-packages
        runs-on: ubuntu-latest
        permissions:
            packages: write
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON(needs.list-packages.outputs.packages) }}
        steps:
            - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
              with:
                  package-name: ${{ matrix.package }}
                  package-type: npm
                  ignore-versions: '^(?!0\.0\.1-)'
                  # About nine days of CI runs, each of which installs the version it just published
                  min-versions-to-keep: 300
